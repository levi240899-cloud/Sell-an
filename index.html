<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sell-an</title>
  
  <!-- Konfigurasi PWA & Manifest -->
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="./manifest.json">
  
  <!-- Konfigurasi khusus iOS (iPhone/iPad) -->
  <link rel="apple-touch-icon" href="./5.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Sell-an">

  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ffffff;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <!-- Ganti src dengan URL /exec dari Google Apps Script -->
  <iframe src="https://script.google.com/macros/s/AKfycbw1xx9nuYW-tsaH3CsAdMoEGmtUrJBOu4LtKzzKODyY8N5asrOvuK3jjdt0HLEX9BYxaw/exec" allow="clipboard-read; clipboard-write; geolocation; microphone; camera"></iframe>

  <!-- Registrasi Service Worker -->
  <script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/Sell-an/sw.js', { scope: '/Sell-an/' })
        .then(reg => console.log('SW Sell-an terdaftar:', reg.scope))
        .catch(err => console.error('SW gagal:', err));
    });
  }
</script>
</body>
</html>
